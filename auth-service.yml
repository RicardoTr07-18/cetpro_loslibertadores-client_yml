spring:
  application:
    name: auth-service

  main:
    lazy-initialization: true        # ⚡ Carga los beans solo cuando se usan
    banner-mode: off                 # Desactiva el banner de Spring Boot

  datasource:
    url: jdbc:postgresql://localhost:5432/Auth
    username: postgres
    password: 1234
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1800000
      initializationFailTimeout: 0   # ⚡ No espera si la BD tarda en responder

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  cloud:
    config:
      request-read-timeout: 2000     # ⚡ Timeout corto para Config Server
      retry:
        max-attempts: 2
        initial-interval: 1000

  # CONFIGURATION REDIS
  cache:
    type: redis
    redis:
      time-to-live: 600000      # 10 minutos
      cache-null-values: false

  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    connect-timeout: 2000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 5
        min-idle: 2
        max-wait: 2000ms

# CONFIGURATION CIRCUIT BREAKER
resilience4j:
  circuitbreaker:
    instances:
      redis:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s
        failure-rate-threshold: 50
        event-consumer-buffer-size: 10

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 30
    initial-instance-info-replication-interval-seconds: 30
  instance:
    prefer-ip-address: true
    hostname: localhost
    lease-renewal-interval-seconds: 15
    lease-expiration-duration-seconds: 40
    metadata-map:
      app-name: ${info.app.name}
      version: ${info.app.version}
      environment: ${info.app.environment}

jwt:
  secret: 08725e547914eb52b7abba9bdfe7be4a2a5e6b8d9ca977d84a20816ff4f5023c
  expiration-ms: 28800000           # ⚡ tiempo de espera 8 hrs

server:
  port: 8081

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: info, health, prometheus
  endpoint:
    health:
      show-details: always
      show-components: always 
  info:
    env:
      enabled: true
  health:
    redis:
      enabled: true

logging:
  level:
    root: warn                       # ⚡ Menos logs = arranque más limpio
    org.springframework: info
    io.github.resilience4j: warn

info:
  app:
    name: auth-service
    title: Servicio de Autenticación
    description: Gestiona autenticación, autorización, roles, permisos y emisión/validación de JWT.
    version: 1.0.0
    author: Ricardo Terrazas
    environment: desarrollo
    license: Proprietary
    contact:
      email: ricardo.terrazasramos@gmail.com
    tags: autenticacion, seguridad, jwt, roles, permisos
    dependencies: Spring Boot, Spring MVC, Spring Security, JPA, PostgreSQL, Eureka
